services:
  laravel_app:
    build: .
    container_name: laravel_container
    restart: unless-stopped
    depends_on:
      - mysql_db
    volumes:
      - .:/var/www
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 50s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx_server:
    image: nginx
    container_name: nginx_container
    restart: unless-stopped
    ports:
      - "3050:80"
    depends_on:
      - laravel_app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www

  mysql_db:
    image: mysql
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_container
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
  
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_container
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - mysql_db
    environment:
      PMA_HOST: mysql_container
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      PMA_DB: mydatabase

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: es-demo
    environment:
      # Single-node mode skips the cluster formation ceremony
      - discovery.type=single-node
      # Disable TLS and authentication for local development only.
      # Never use this setting in production.
      - xpack.security.enabled=false
      # Cap heap at 512 MB so it does not consume your entire machine RAM
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      # Named volume persists index data across container restarts
      - esdata:/usr/share/elasticsearch/data



volumes:
  mysql_data:

  esdata:
    driver: local

 

